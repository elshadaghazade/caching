[project]
name = "task"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["httpx2>=0.27", "pytest>=8.0"]

[project.scripts]
cache-cli = "cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
